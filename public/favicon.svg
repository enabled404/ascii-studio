<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141520"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa64"/>
      <stop offset="50%" stop-color="#f26522"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#282a3c" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="34" font-weight="900" fill="url(#glyph)" text-anchor="middle" letter-spacing="-1">▚</text>
  </g>
  <circle cx="50" cy="16" r="3.5" fill="#00f0ff"/>
</svg>
